name: Generate Gradle Wrapper

on:
  workflow_dispatch:
    inputs:
      gradle_version:
        description: 'Gradle version for the wrapper'
        required: true
        default: '8.13'

permissions:
  contents: write

jobs:
  wrapper:
    name: Generate and commit wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ inputs.gradle_version }}

      - name: Generate wrapper in a clean temp folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wrapgen
          cd /tmp/wrapgen
          gradle wrapper --gradle-version "${{ inputs.gradle_version }}" --distribution-type bin
          ls -la . gradle/wrapper

      - name: Copy only the missing wrapper files into the repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gradle/wrapper
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [ -f "$f" ]; then
              echo "Keeping existing $f"
            else
              cp "/tmp/wrapgen/$f" "$f"
              echo "Added $f"
            fi
          done
          chmod +x gradlew

      - name: Commit wrapper files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git update-index --chmod=+x gradlew
          if git diff --cached --quiet; then
            echo "Nothing to commit. Wrapper already complete."
          else
            git commit -m "Add Gradle wrapper"
            git push
          fi
